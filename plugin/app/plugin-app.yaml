apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: plugin-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: argocd
  project: default
  source:
    repoURL: https://github.com/chengfang/image-updater-examples.git
    targetRevision: main
    path: plugin/source
    plugin:
      name: my-custom-plugin
      env:
        - name: NGINX_IMAGE_NAME
          value: nginx
        - name: NGINX_IMAGE_TAG
          value: 1.20.0
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
