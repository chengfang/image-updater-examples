apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: my-custom-plugin
    spec:
      version: v1.0
      discover:
        find:
          command:
            - sh
            - "-c"
            - "test -f echo-plugin.marker && echo 'Echo plugin detected'"
      init:
        command:
          - sh
          - "-c"
          - |
            echo "Initializing echo plugin..."
            echo "NGINX_IMAGE_NAME=${NGINX_IMAGE_NAME}"
            echo "NGINX_IMAGE_TAG=${NGINX_IMAGE_TAG}"
      generate:
        command:
          - sh
          - "-c"
          - |
            cat <<EOF
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              name: plugin-app-nginx
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: plugin-app
              template:
                metadata:
                  labels:
                    app: plugin-app
                spec:
                  containers:
                  - name: nginx
                    image: ${NGINX_IMAGE_NAME}:${NGINX_IMAGE_TAG}
                    ports:
                    - containerPort: 80
            EOF
