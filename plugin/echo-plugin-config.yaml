apiVersion: v1
kind: ConfigMap
metadata:
  name: echo-plugin
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: my-custom-plugin
    spec:
      version: v1.0
      discover:
        find:
          command:
            - sh
            - "-c"
            - "test -f echo-plugin.marker && echo 'Echo plugin detected'"
      init:
        command:
          - sh
          - "-c"
          - |
            echo "Initializing echo plugin..."
            echo "ARGOCD_ENV_NGINX_IMAGE_NAME=${ARGOCD_ENV_NGINX_IMAGE_NAME}"
            echo "ARGOCD_ENV_NGINX_IMAGE_TAG=${ARGOCD_ENV_NGINX_IMAGE_TAG}"
      generate:
        command:
          - sh
          - "-c"
          - |
            printf 'apiVersion: apps/v1\n'
            printf 'kind: Deployment\n'
            printf 'metadata:\n'
            printf '  name: plugin-app-nginx\n'
            printf 'spec:\n'
            printf '  replicas: 1\n'
            printf '  selector:\n'
            printf '    matchLabels:\n'
            printf '      app: plugin-app-nginx\n'
            printf '  template:\n'
            printf '    metadata:\n'
            printf '      labels:\n'
            printf '        app: plugin-app-nginx\n'
            printf '    spec:\n'
            printf '      containers:\n'
            printf '      - name: nginx\n'
            printf '        image: %s:%s\n' "${ARGOCD_ENV_NGINX_IMAGE_NAME}" "${ARGOCD_ENV_NGINX_IMAGE_TAG}"
            printf '        ports:\n'
            printf '        - containerPort: 80\n'
